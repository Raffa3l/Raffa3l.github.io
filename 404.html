<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · logicc.dev</title>
<meta name="description" content="Die angeforderte Seite existiert nicht.">
<meta name="robots" content="noindex">
<style>
  :root{
    --bg: #0b0e0d;
    --fg: #d7ddd9;
    --muted: #7c8a83;
    --accent: #5fbf8f;
    --error: #d9826b;
    --border: #1e2622;
  }
  *{ box-sizing: border-box; }
  html{ background: var(--bg); }
  body{
    margin: 0;
    padding: 4rem 1.5rem 6rem;
    background: var(--bg);
    color: var(--fg);
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 15px;
    line-height: 1.6;
  }
  main{ max-width: 720px; margin: 0 auto; }
  .prompt{ color: var(--accent); }
  .line{ margin: 0 0 0.25rem; overflow-wrap: anywhere; }
  .cmd{ color: var(--fg); }
  .err{ color: var(--error); margin: 0 0 2.5rem; overflow-wrap: anywhere; }
  .muted{ color: var(--muted); }

  .caret{
    display: inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--accent);
    margin-left: 2px;
    vertical-align: text-bottom;
    transform: translateY(-0.12em);
    animation: blink 1.1s steps(1) infinite;
  }
  @media (prefers-reduced-motion: reduce){ .caret{ animation: none; opacity: 1; } }
  @keyframes blink{ 50%{ opacity: 0; } }

  .readme{
    border: 1px solid var(--border);
    padding: 1.5rem 1.75rem;
    margin-bottom: 2.5rem;
  }
  .readme .path{ color: var(--muted); font-size: 0.8rem; margin: 0 0 1rem; }
  .readme h2{ font-size: 1rem; font-weight: 400; color: var(--fg); margin: 0 0 1rem; }
  .readme h2::before{ content: "# "; color: var(--accent); }
  .readme p{ margin: 0 0 0.75rem; }
  .readme p:last-child{ margin-bottom: 0; }
  .readme .tagline{ color: var(--muted); }
  .readme .tagline::before{ content: "* "; color: var(--accent); }
  .readme .tagline::after{ content: " *"; color: var(--accent); }
  .readme ul{ list-style: none; margin: 0 0 0.75rem; padding: 0; }
  .readme li::before{ content: "- "; color: var(--accent); }
  a{ color: var(--accent); text-decoration: none; }
  a:hover, a:focus-visible{ text-decoration: underline; }
  a:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }

  .prompt-line{ color: var(--fg); margin: 0 0 2.5rem; }
</style>
</head>
<body>
<main>
  <p class="line"><span class="prompt">user@logicc</span>:~$ <span class="cmd">cd <span id="req-path">/unbekannt</span></span></p>
  <p class="err">bash: cd: <span id="req-path-err">/unbekannt</span>: No such file or directory</p>

  <section class="readme">
    <p class="path">/404.md</p>
    <h2>Fehler 404</h2>
    <p class="tagline">Seite nicht gefunden</p>
    <p>Die angeforderte Adresse existiert in dieser Zone nicht oder wurde verschoben.</p>
    <ul>
      <li><a href="/">cd ~</a> <span class="muted">zur Startseite</span></li>
      <li><a href="javascript:history.back()" id="back-link">cd -</a> <span class="muted">zur vorherigen Seite</span></li>
    </ul>
    <p>exit 404</p>
  </section>

  <p class="prompt-line"><span class="prompt">user@logicc</span>:~$&nbsp;<span class="caret" aria-hidden="true"></span></p>
</main>
<script>
(function(){
  // Angeforderten Pfad anzeigen (textContent verhindert HTML-Injection)
  var path = "/unbekannt";
  try { path = decodeURIComponent(window.location.pathname) || path; } catch (e) { path = window.location.pathname || path; }
  if (path.length > 120) { path = path.slice(0, 117) + "..."; }
  ["req-path", "req-path-err"].forEach(function(id){
    var el = document.getElementById(id);
    if (el) { el.textContent = path; }
  });

  // "cd -" ausblenden, wenn keine Vorgängerseite existiert
  if (window.history.length <= 1) {
    var back = document.getElementById("back-link");
    if (back && back.parentNode) { back.parentNode.style.display = "none"; }
  }
})();
</script>
</body>
</html>
